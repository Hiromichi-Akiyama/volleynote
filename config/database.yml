default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: <%= ENV['DATABASE_PASSWORD'] %>
  host: localhost

development:
  <<: *default
  database: volleynote_development

test:
  <<: *default
  database: volleynote_test

production:
  <<: *default
  database: volleynote_production
  username: volleynote
  password: <%= ENV["VOLLEYNOTE_DATABASE_PASSWORD"] %>